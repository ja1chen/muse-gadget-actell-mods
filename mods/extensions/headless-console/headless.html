<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse Headless · ESP32-S3</title><style>body{max-width:780px;margin:40px auto;padding:20px;background:#111b16;color:#e4f5e8;font:16px/1.6 system-ui}aside{border:1px solid #d7a657;padding:16px;color:#f3cf93}input,textarea,button{font:inherit;padding:10px;margin:8px 0;box-sizing:border-box}input,textarea{width:100%;background:#203327;color:white;border:1px solid #73927d}button{background:#b7e7bf;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:450px;overflow:auto}</style><h1>Muse 无屏文字台</h1><aside>开发模式：仅在隔离、可信的局域网使用。HTTP 聊天与临时令牌是明文；不要通过公网或不可信 Wi-Fi 访问。此页面调用真实 Muse 会话，发送后 Agent 可能开始执行任务。不会直接提供 Actell 工具或密钥。</aside><label>从当前启动串口读取的 Console boot token<input id="token" type="password" autocomplete="off" maxlength="32" spellcheck="false"></label><button id="connect">连接</button><p id="status" role="status">未连接</p><label>文字（最多 4096 UTF-8 字节）<textarea id="text" rows="4" maxlength="4096"></textarea></label><button id="send" disabled>明确发送给 Muse</button><button id="cancel" disabled>请求取消</button><pre id="out" aria-live="polite"></pre><script>
'use strict';const $=x=>document.getElementById(x);let token='',cursor=0,connected=false,running=false,pending=false,timer=null,generation=0,lines=[];
function log(s){lines.push(typeof s==='string'?s:JSON.stringify(s));lines=lines.slice(-120);$('out').textContent=lines.join('\n');}
function controls(){$('send').disabled=!connected||running||pending;$('cancel').disabled=!connected||!running;}
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Console-Token':token},body:JSON.stringify(data),cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j;}
async function poll(g){try{const j=await api('/api/events',{after:cursor});if(g!==generation)return;cursor=j.cursor;running=j.active;connected=true;$('status').textContent=j.status+' · '+j.detail;if(j.lost)log('警告：事件缓冲已溢出或板已重启，历史不完整。请到 Muse app 查看完整会话。');j.events.forEach(log);controls();timer=setTimeout(()=>poll(g),1000);}catch(e){if(g!==generation)return;connected=false;controls();$('status').textContent='连接中断，请重新连接；不会重发文字。';log(e.message);}}
$('connect').onclick=()=>{clearTimeout(timer);generation++;token=$('token').value.trim();$('token').value='';if(!/^[0-9a-f]{32}$/.test(token)){log('请输入串口的 32 位启动 token。');return;}cursor=0;poll(generation);};
$('send').onclick=async()=>{if(!connected||running||pending)return;const text=$('text').value.trim();if(!text||new TextEncoder().encode(text).length>4096){log('文字必须为 1..4096 UTF-8 字节。');return;}pending=true;controls();try{log(await api('/api/text',{text}));running=true;}catch(e){log('发送未确认；不会自动重发：'+e.message);}finally{pending=false;controls();}};
$('cancel').onclick=async()=>{$('cancel').disabled=true;try{log(await api('/api/cancel',{}));}catch(e){log('取消未确认：'+e.message);}finally{controls();}};
window.addEventListener('pagehide',()=>{clearTimeout(timer);generation++;token='';});
</script></html>
